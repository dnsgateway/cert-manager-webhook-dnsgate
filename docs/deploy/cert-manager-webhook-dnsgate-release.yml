---
# Source: cert-manager-webhook-dnsgate/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook-dnsgate
  labels:
    helm.sh/chart: cert-manager-webhook-dnsgate-0.0.2
    app.kubernetes.io/name: cert-manager-webhook-dnsgate
    app.kubernetes.io/instance: cert-manager-webhook-dnsgate
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager-webhook-dnsgate
      app.kubernetes.io/instance: cert-manager-webhook-dnsgate
  template:
    metadata:
      annotations:
      labels:
        helm.sh/chart: cert-manager-webhook-dnsgate-0.0.2
        app.kubernetes.io/name: cert-manager-webhook-dnsgate
        app.kubernetes.io/instance: cert-manager-webhook-dnsgate
        app.kubernetes.io/version: "v0.1.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      enableServiceLinks: false
      serviceAccountName: cert-manager-webhook-dnsgate
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsUser: 65532
      containers:
        - name: cert-manager-webhook-dnsgate
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          image: "ghcr.io/dnsgateway/cert-manager-webhook-dnsgate:v0.1.0"
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=6443
            - --tls-cert-file=/var/run/certs/tls.crt
            - --tls-private-key-file=/var/run/certs/tls.key
          env:
            - name: GROUP_NAME
              value: "acme.dnsgate.link"
          ports:
            - name: https
              containerPort: 6443
              protocol: TCP
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: certs
              mountPath: /var/run/certs
              readOnly: false
      volumes:
        - name: certs
          secret:
            secretName: cert-manager-webhook-dnsgate-tls
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cert-manager-webhook-dnsgate
                    app.kubernetes.io/instance: cert-manager-webhook-dnsgate
                namespaces:
                  - "cert-manager"
                topologyKey: kubernetes.io/hostname
              weight: 1

