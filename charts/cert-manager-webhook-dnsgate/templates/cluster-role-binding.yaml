---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-dnsgate.fullname" . }}:auth-delegator
  labels:
    {{- include "cert-manager-webhook-dnsgate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-manager-webhook-dnsgate.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-dnsgate.fullname" . }}:auth-reader
  labels:
    {{- include "cert-manager-webhook-dnsgate.labels" . | nindent 4 }}
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-manager-webhook-dnsgate.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
