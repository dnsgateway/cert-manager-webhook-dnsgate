apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-manager-webhook-dnsgate.fullname" . }}
  labels:
    {{- include "cert-manager-webhook-dnsgate.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ipFamilyPolicy: {{ if eq (len .Values.service.ipFamilies) 2 }}PreferDualStack{{ else }}SingleStack{{ end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "cert-manager-webhook-dnsgate.selectorLabels" . | nindent 4 }}
