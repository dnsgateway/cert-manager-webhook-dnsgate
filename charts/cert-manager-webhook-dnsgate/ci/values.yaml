image:
  pullPolicy: Always
  tag: edge-arm64

args:
  # - --v=4
  - --log-level=info
  - --gateway=dnsgate.default.svc:443
  - --gateway-timeout=30s
  - --ca-file=/etc/tls-certs/tls.crt

tls:
  type: "helm"

priorityClassName: system-cluster-critical

volumes:
  - name: tls-certs
    secret:
      secretName: dnsgate-tls
volumeMounts:
  - name: tls-certs
    mountPath: /etc/tls-certs
    readOnly: true

podAntiAffinityPreset: hard
podAntiAffinityPresetKey: kubernetes.io/hostname

nodeSelector:
  node-role.kubernetes.io/control-plane: ""
tolerations:
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
